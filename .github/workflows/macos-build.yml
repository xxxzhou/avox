name: macOS Build

on:
  workflow_dispatch:
  push:
    branches: [main, "ci/**"]
    paths:
      - "src/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "build_mac.py"
      - "build_common.py"
      - "build_ios.py"
      - ".github/workflows/macos-build.yml"

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: macos-14
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Cache Git Submodules
        uses: actions/cache@v4
        id: cache-submodules
        with:
          path: |
            .git/modules
            3rdparty
          key: submodules-macos-${{ hashFiles('.gitmodules') }}

      - name: Checkout Submodules
        if: steps.cache-submodules.outputs.cache-hit != 'true'
        run: |
          # SSH 协议的 submodule URL 改为 HTTPS
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive --depth=1

      - name: Install Vulkan SDK (MoltenVK)
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          cache: true

      # 缓存已编译的第三方模块, 后续迭代只重编 avplay; submodule 升级时手动换 key 版本号
      - name: Cache 3rdparty Module Builds
        uses: actions/cache@v4
        id: cache-mac-modules
        with:
          path: |
            build/macos/faad2
            build/macos/fdk-aac
            build/macos/freetype
            build/macos/sherpa-onnx
            build/macos/sentencepiece
            3rdparty/zlmediakit/release
          key: macos-modules-v1-${{ hashFiles('.gitmodules') }}

      - name: Build (build_mac.py)
        env:
          AVOX_FORCE_REBUILD: "False"
        run: python3 build_mac.py

      - name: Verify SDK Product
        run: |
          libs=$(find build/macos -name "libavox*" 2>/dev/null | head -10)
          echo "$libs"
          test -n "$libs" || { echo "未找到 avox SDK 产物"; exit 1; }
