name: Apple Build (iOS/macOS)

on:
  workflow_dispatch:
  push:
    branches: [main, "ci/**"]
    paths:
      - "src/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "build_mac.py"
      - "build_ios.py"
      - "build_common.py"
      - ".github/workflows/macos-build.yml"

concurrency:
  group: apple-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build-${{ matrix.platform }}
    runs-on: macos-14
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        platform: [macos, ios]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Cache Git Submodules
        uses: actions/cache@v4
        id: cache-submodules
        with:
          path: |
            .git/modules
            3rdparty
          key: submodules-apple-${{ hashFiles('.gitmodules') }}

      - name: Checkout Submodules
        if: steps.cache-submodules.outputs.cache-hit != 'true'
        run: |
          # SSH 协议的 submodule URL 改为 HTTPS
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive --depth=1

      # MoltenVK.xcframework 同时含 ios-arm64/macos-arm64 切片, 两个平台共用本步骤; action 会设 VULKAN_SDK 环境变量
      - name: Install Vulkan SDK (MoltenVK)
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          cache: true

      # 1.4.357.x 起 LunarG SDK 不再内嵌 MoltenVK.xcframework, 从 KhronosGroup 官方 release 补齐
      # LinkVulkan.cmake 约定切片目录名 ios-arm64 / macos-arm64, Khronos 的 macos 切片名为 macos-arm64_x86_64 需链接
      - name: Add MoltenVK xcframework to Vulkan SDK
        run: |
          curl -sL -o /tmp/mvk.tar "https://github.com/KhronosGroup/MoltenVK/releases/download/v1.4.2/MoltenVK-all.tar"
          mkdir -p /tmp/mvk && tar -xf /tmp/mvk.tar -C /tmp/mvk
          xcf=$(find /tmp/mvk -type d -name "MoltenVK.xcframework" | head -1)
          test -n "$xcf" || { echo "未找到 MoltenVK.xcframework"; ls -R /tmp/mvk | head -40; exit 1; }
          mkdir -p "$VULKAN_SDK/lib"
          rm -rf "$VULKAN_SDK/lib/MoltenVK.xcframework"
          cp -R "$xcf" "$VULKAN_SDK/lib/MoltenVK.xcframework"
          cd "$VULKAN_SDK/lib/MoltenVK.xcframework"
          [ -d macos-arm64 ] || ln -s macos-arm64_x86_64 macos-arm64
          [ -d ios-arm64 ] && [ -d macos-arm64 ] && echo "MoltenVK slices OK: $(ls)"

      # 缓存已编译的第三方模块, 后续迭代只重编 avplay; submodule 升级时手动换 key 版本号
      - name: Cache 3rdparty Module Builds
        uses: actions/cache@v4
        id: cache-mac-modules
        with:
          path: |
            build/${{ matrix.platform }}/faad2
            build/${{ matrix.platform }}/fdk-aac
            build/${{ matrix.platform }}/freetype
            build/${{ matrix.platform }}/sherpa-onnx
            build/${{ matrix.platform }}/sentencepiece
            3rdparty/zlmediakit/release
          key: ${{ matrix.platform }}-modules-v1-${{ hashFiles('.gitmodules') }}

      - name: Build (build_${{ matrix.platform }}.py)
        env:
          AVOX_FORCE_REBUILD: "False"
        run: python3 build_${{ matrix.platform }}.py

      - name: Verify SDK Product
        run: |
          libs=$(find build/${{ matrix.platform }} -name "libavox*" 2>/dev/null | head -10)
          echo "$libs"
          test -n "$libs" || { echo "未找到 avox SDK 产物"; exit 1; }
